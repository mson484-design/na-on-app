name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter create . --platforms=android --project-name na_on --org com.example
      - name: Update Kotlin, MinSdkVersion and Add Permissions
        run: |
          find android -type f \( -name "build.gradle" -o -name "settings.gradle" \) -exec sed -i "s/1\.[0-8]\.[0-9]*/1.9.0/g" {} +
          find android -type f \( -name "build.gradle" -o -name "settings.gradle" \) -exec sed -i "s/kotlin_version = '.*'/kotlin_version = '1.9.0'/g" {} +
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          
          # AndroidManifest.xml에 인터넷 및 마이크 권한 자동 추가
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />' "$MANIFEST_PATH"
          fi
                 - name: Build APK with Gemini API Key
          env:
            GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          run: flutter build apk --release --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY"

          - uses: actions/upload-artifact@v4
          with:
            name: app-release
            path: build/app/outputs/flutter-apk/app-release.apk
            retention-days: 1
