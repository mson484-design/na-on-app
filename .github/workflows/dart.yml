name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter create . --platforms=android --project-name na_on --org com.example
      - name: Update Kotlin Version everywhere
        run: |
          find android -type f \( -name "build.gradle" -o -name "settings.gradle" \) -exec sed -i "s/1\.[0-8]\.[0-9]*/1.9.0/g" {} +
          find android -type f \( -name "build.gradle" -o -name "settings.gradle" \) -exec sed -i "s/kotlin_version = '.*'/kotlin_version = '1.9.0'/g" {} +
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1
