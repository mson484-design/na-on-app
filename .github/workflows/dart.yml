name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter create . --platforms=android --project-name na_on --org com.example --android-language kotlin
      - name: Force Kotlin Version
        run: |
          echo "buildscript { ext.kotlin_version = '1.9.0' }" > android/build.gradle
          echo "allprojects { repositories { google(); mavenCentral() } }" >> android/build.gradle
          echo "rootProject.buildDir = '../build'" >> android/build.gradle
          echo "subprojects { project.buildDir = \"\${rootProject.buildDir}/\${project.name}\" }" >> android/build.gradle
          echo "subprojects { project.evaluationDependsOn(':app') }" >> android/build.gradle
          echo "task clean(type: Delete) { delete rootProject.buildDir }" >> android/build.gradle
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1
